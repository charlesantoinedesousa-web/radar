name: radar-daily
on:
  schedule:
    - cron: "30 8 * * *"   # édition du matin, 8h30 UTC (9h30/10h30 à Paris), après la remise à zéro du quota Gemini
    - cron: "30 10 * * *"  # 2e essai : seulement si l'édition du matin a échoué (Gemini surchargé)
    - cron: "0 13 * * *"   # mise à jour « Ça monte », 13h UTC (14h/15h à Paris)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 radar.py ${{ github.event.schedule == '0 13 * * *' && '--monte' || (github.event.schedule == '30 10 * * *' && '--si-absent' || '') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_WEBHOOK: ${{ secrets.RADAR_WEBHOOK }}
      - name: Publier
        run: |
          git config user.name radar && git config user.email radar@users.noreply.github.com
          git add docs && git commit -m "RADAR $(date +%F-%H%M)" || exit 0
          git pull --rebase || true
          git push || true
