name: radar-daily
on:
  schedule:
    - cron: "0 6 * * *"    # édition du matin, 6h UTC (7h/8h à Paris)
    - cron: "0 12 * * *"   # mise à jour « Ça monte », 12h UTC (13h/14h à Paris)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 radar.py ${{ github.event.schedule == '0 12 * * *' && '--monte' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_WEBHOOK: ${{ secrets.RADAR_WEBHOOK }}
      - name: Publier
        run: |
          git config user.name radar && git config user.email radar@users.noreply.github.com
          git add docs && git commit -m "RADAR $(date +%F-%H%M)" || exit 0
          git pull --rebase || true
          git push || true
