header{padding:28px 16px 12px;max-width:1100px;margin:auto}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut)}
.b{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11px;padding:2px 8px;border-radius:99px;color:#fff}
.chaud{background:var(--hot)}.montant{background:var(--up)}.fond{background:var(--base)}
h2{font-size:18px;line-height:1.25;margin:0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:2px}
.proof{border-left:3px solid var(--acc);padding-left:10px}
.angle{background:var(--bg);border-radius:8px;padding:10px;font-size:14px}
.angle b{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:4px}
button.cp{margin-top:6px;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:3px 8px;cursor:pointer}
.warn{background:#e5322d1a;color:var(--hot);border-radius:8px;padding:8px 10px;font-size:13px}
#monte,#chiffres,#auto{max-width:1100px;margin:8px auto;padding:0 16px}
#monte h3,#chiffres h3,#auto h3{margin:10px 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.mrow{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:10px 14px;margin-bottom:8px;display:grid;gap:2px}
.mrow.no{border-left-color:var(--mut);opacity:.85}
.mrow b{font-size:15px}.tiny{font-size:12px;color:var(--mut)}a{color:inherit}
.sec{grid-column:1/-1;margin:14px 0 0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.sec small{text-transform:none;letter-spacing:0;font-size:12px;margin-left:8px}
.card.a3{border-top:4px solid var(--base)}.b.fam{background:var(--base)}
.cl{display:flex;flex-wrap:wrap;gap:4px}.cl span{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mut)}
.idea{background:var(--bg);border-radius:8px;padding:10px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.raw{max-width:1100px;margin:auto;padding:8px 16px 60px;overflow-x:auto}

ser vite. Ce peut être un outil, un objet, un affichage, un détournement, un service, un événement, un contenu : pas forcément numérique. Format :\nN. Titre\n- Public touché\n- Le problème : une phrase appuyée sur les signaux\n- L'idée : une à trois phrases concrètes\n- Le format : outil, affichage, objet, événement, contenu, détournement...\n- Effort estimé : léger (quelques jours) / moyen / lourd, à confirmer\n- Clients possibles : noms pris dans la liste, ou aucun\n- Limites : neutralité, droits, risques, ce qu'il ne faut pas promettre\n- Sources : médias et liens, et À vérifier\n\nRègles : n'invente aucun chiffre, étude, institut ni source ; zéro marronnier déjà rincé sauf contrecoup ; priorité aux frictions et aux problèmes pratiques ; privilégie les sujets confirmés par plusieurs sources et ceux qui concernent au moins un client ; français sobre, sans métaphore physique ni mot inventé.\nPour les idées « Artefact 3000 » : NON PARTISANES (elles aident les gens, ne prennent jamais parti pour ou contre un mouvement, un gouvernement ou une entreprise), jamais sur un drame, un deuil ou une catastrophe, aucune donnée personnelle sensible, aucun effet chiffré promis.\nLes sujets sensibles (deuil, drame, crime, polémique clivante) ne reçoivent AUCUNE idée : liste-les à part sous « Ça monte, ne pas rebondir ». Pour les associations de la liste, un sujet grave n'est possible que si l'idée est respectueuse et utile (note « validation requise »).\n\nDATE : 24/11/2026 19:37\n\nCLIENTS DE L'AGENCE (nom : thèmes) :\n- Thermor : chauffage, eau chaude, radiateur, chauffe-eau, pompe à chaleur, facture d'énergie, facture de chauffage, froid\n- Atlantic : chauffage, pompe à chaleur, eau chaude, chauffe-eau, climatisation, canicule, facture d'énergie, vague de froid\n- Direct Assurance : assurance, assureur, sinistre, sécurité routière, accident de la route, permis de conduire, tempête, grêle\n- Pierre & Vacances : vacances, vacances scolaires, séjour, week-end, station de ski, ski, tourisme, location de vacances\n- En Avant Toutes : violences sexistes, violences conjugales, harcèlement, cyberharcèlement, consentement, féminisme, sexisme, égalité femmes-hommes\n- True Fruits : smoothie, jus de fruits, fruits, boisson, sucre, fruit\n- Groupe ADP : aéroport, aéroports, Roissy, Orly, avion, aérien, compagnie aérienne, bagages\n- Paris Aéroport : aéroport, aéroports, Roissy, Orly, avion, aérien, compagnie aérienne, bagages\n- Fondation BNP Paribas : mécénat, solidarité, inclusion, précarité, handicap, association, recherche médicale, fondation\n- TotalEnergies : carburant, essence, gazole, électricité, gaz, transition énergétique, voiture électrique, borne de recharge\n- Robertet : parfum, parfumerie, senteur, matières naturelles, arômes, jasmin, olfactif, grasse\n- eBay : seconde main, occasion, reconditionné, vide-grenier, enchères, vente en ligne, vinted, leboncoin\n- Azura : (à préciser : secteur et thèmes d'actualité)\n- TF1 + : série, téléréalité, streaming, TF1, football, émission, audience, Star Academy\n- WWF : biodiversité, climat, océan, océans, forêt, espèces menacées, pollution, réchauffement\n\nCONTEXTE :\nArtefact 3000 est une agence de publicité. Elle ne vend pas d'outil : elle répond à un problème réel des gens par une idée créative et originale.\nTon souhaité : direct, concret, sans slogan creux. Les idées doivent pouvoir se réaliser vite.\nCLIENT: Thermor | chauffage, eau chaude, radiateur, chauffe-eau, pompe à chaleur, facture d'énergie, facture de chauffage, froid, vague de froid, rénovation énergétique, isolation\nCLIENT: Atlantic | chauffage, pompe à chaleur, eau chaude, chauffe-eau, climatisation, canicule, facture d'énergie, vague de froid, rénovation énergétique, isolation\nCLIENT: Direct Assurance | assurance, assureur, sinistre, sécurité routière, accident de la route, permis de conduire, tempête, grêle, franchise, cambriolage, constat\nCLIENT: Pierre & Vacances | vacances, vacances scolaires, séjour, week-end, station function allClients(){const s=new Set();[...D.fiches,...(D.sujets||[]),...(D.frictions||[]),...(D.problemes||[])].forEach(x=>(x.clients||[]).forEach(c=>s.add(c)));return [...s]}
function bar(){
 const hasF=D.fiches.length,cls=allClients();
 if(!hasF&&!cls.length){$("#bar").innerHTML="";return}
 let h="";
 if(hasF){
  const FL={all:"Tout",client:"Pour les clients",artefact3000:"Pour les gens · Artefact 3000"};
  h+=Object.keys(FL).map(k=>`<button class="chip ${fam===k?"on":""}" data-f="${k}">${FL[k]}</button>`).join("");
  h+=["all",...Object.keys(U)].map(k=>`<button class="chip ${urg===k?"on":""}" data-u="${k}">${k==="all"?"Toutes urgences":U[k]}</button>`).join("");
 }

 $("#bar").innerHTML=h;

 if($("#q"))$("#q").oninput=e=>{q=e.target.value.toLowerCase();draw()};
}
function card(f){
 const liens=(f.liens||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(" · ");
 const pied=`<div class="tiny">Sources : ${esc((f.sources||[]).join(", "))}${liens?"<br>"+liens:""}</div>${f.a_verifier?`<div class="tiny">À vérifier : ${esc(f.a_verifier)}</div>`:""}`;
 if(f.famille==="artefact3000")return `<article class="card a3"><div class="top"><span class="b fam">Artefact 3000</span><span>${esc(f.categorie||"")}</span></div>
 <h2>${esc(f.titre)}</h2>${chips(f.clients)}
 <div><div class="lbl">Public touché</div>${esc(f.public)}</div>
 <div><div class="lbl">Le problème</div>${esc(f.probleme||f.signal)}</div>
 ${f.preuve?`<div class="proof"><div class="lbl">La preuve</div>${esc(f.preuve)}</div>`:""}
 <div class="idea"><div class="lbl">L'idée</div>${f.accroche?`<div style="font-size:17px;font-weight:700;color:var(--base);margin-bottom:4px">« ${esc(f.accroche)} »</div>`:""}<b>${esc(f.idee)}</b>${f.originalite?`<div class="tiny" style="margin-top:6px">Ce qui la rend originale : ${esc(f.originalite)}</div>`:""}${(f.format||f.effort)?`<div class="tiny">${f.format?"Format : "+esc(f.format):""}${f.effort?" · effort estimé (à confirmer) : "+esc(f.effort):""}</div>`:""}<button class="cp" data-t="${esc(f.idee)}">Copier</button></div>
 ${f.limites?`<div class="tiny">⚠ Limites : ${esc(f.limites)}</div>`:""}${pied}</article>`;
 return `<article class="card"><div class="top"><span class="b ${esc(f.urgence)}">${U[f.urgence]||esc(f.urgence)}</span><span>${esc(f.categorie)}</span></div>
 <h2>${esc(f.titre)}</h2>${chips(f.clients)}
 <div><div class="lbl">Le signal</div>${esc(f.signal)}</div>
 <div><div class="lbl">Statut</div>${esc(f.statut)}</div>
 ${f.insight?`<div class="proof"><div class="lbl">L'insight</div><b>${esc(f.insight)}</b></div>`:""}
 ${f.preuve?`<div class="proof"><div class="lbl">La preuve</div>${esc(f.preuve)}</div>`:""}
 ${f.rebondable===false?`<div class="warn"><b>Ne pas rebondir.</b> ${esc(f.risque)}</div>`:(f.risque?`<div class="tiny">⚠ ${esc(f.risque)}</div>`:"")}
 ${(f.angles||[]).map((a,i)=>`<div class="angle"><b>Pour : ${esc(a.pour_qui)}</b>${esc(a.message)}<br><button class="cp" data-t="${esc(a.message)}">Copier</button></div>`).join("")}
 ${pied}</article>`;
}
function ok(f){return (fam==="all"||(f.famille||"client")===fam)&&(urg==="all"||f.urgence===urg)&&(cat==="all"||f.categorie===cat)&&(cli==="all"||(f.clients||[]).includes(cli))&&(!q||JSON.stringify(f).toLowerCase().includes(q))}
function applyCli(){document.querySelectorAll("[data-cl]").forEach(e=>{const l=e.dataset.cl?e.dataset.cl.split("|"):[];e.style.display=(cli==="all"||l.includes(cli))?"":"none"})}

 applyCli();
}

function auto(){

 if((D.sujets||[]).length)A.push("<h3>Sujets repérés par plusieurs sources</h3>"+D.sujets.map(s=>`<div class="mrow ${s.sensible?"no":""}" data-cl="${esc((s.clients||[]).join("|"))}"><b>${esc(s.titre)} ${s.sensible?'<span class="tiny">· sensible, ne pas rebondir</span>':""}</b><span class="tiny">${s.medias.length} médias : ${esc(s.medias.slice(0,6).join(", "))} · mots-clés : ${esc((s.tags||[]).join(", "))}${cl(s)}</span><span class="tiny">${s.liens.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(" · ")}</span></div>`).join(""));
