*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{padding:28px 16px 12px;max-width:1100px;margin:auto}

.sub{color:var(--mut);font-size:13px}

.bar{max-width:1100px;margin:auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip,select,input{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:6px 12px;cursor:pointer}
.chip.on{background:var(--fg);color:var(--bg)}input{cursor:text;min-width:180px}
main{max-width:1100px;margin:auto;padding:8px 16px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut)}
.b{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11px;padding:2px 8px;border-radius:99px;color:#fff}
.chaud{background:var(--hot)}.montant{background:var(--up)}.fond{background:var(--base)}
h2{font-size:18px;line-height:1.25;margin:0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:2px}
.proof{border-left:3px solid var(--acc);padding-left:10px}
.angle{background:var(--bg);border-radius:8px;padding:10px;font-size:14px}
.angle b{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:4px}
button.cp{margin-top:6px;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:3px 8px;cursor:pointer}
.warn{background:#e5322d1a;color:var(--hot);border-radius:8px;padding:8px 10px;font-size:13px}
#monte,#chiffres,#auto{max-width:1100px;margin:8px auto;padding:0 16px}
#monte h3,#chiffres h3,#auto h3{margin:10px 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.mrow{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:10px 14px;margin-bottom:8px;display:grid;gap:2px}
.mrow.no{border-left-color:var(--mut);opacity:.85}
.mrow b{font-size:15px}.tiny{font-size:12px;color:var(--mut)}a{color:inherit}
.sec{grid-column:1/-1;margin:14px 0 0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.sec small{text-transform:none;letter-spacing:0;font-size:12px;margin-left:8px}
.card.a3{border-top:4px solid var(--base)}.b.fam{background:var(--base)}
.cl{display:flex;flex-wrap:wrap;gap:4px}.cl span{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mut)}
.idea{background:var(--bg);border-radius:8px;padding:10px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.raw{max-width:1100px;margin:auto;padding:8px 16px 60px;overflow-x:auto}

ement/crise-climatique/cop-climat/pays-petroliers-offensifs-europeens-a-sec-organisateurs-largues-qui-est-responsable-de-l-echec-de-la-cop31-sur-le-climat_8295716.html#xtor=RSS-3-[lestitres]", "age": 5, "evenement": "bloqué"}], "nb_medias": 1, "clients": ["WWF"]}], "clients_liste": ["Thermor", "Atlantic", "Direct Assurance", "Pierre & Vacances", "En Avant Toutes", "True Fruits", "Groupe ADP", "Paris Aéroport", "Fondation BNP Paribas", "TotalEnergies", "Robertet", "eBay", "Azura", "TF1 +", "WWF"], "prompt": "Tu es l'assistant de veille d'une agence de publicité, « Artefact 3000 », dirigée par un directeur de création. Voici les signaux du jour repérés automatiquement (articles récents, pics, chiffres, frictions, problèmes concrets).\nÀ partir de ces seuls éléments, rédige 10 fiches en DEUX FAMILLES :\n\nA) 6 fiches « POUR LES CLIENTS » : un fait, une friction ou une contre-tendance utile à un ou plusieurs clients de l'agence (liste ci-dessous). Format :\nN. Domaine : titre\n- Clients concernés : noms pris dans la liste\n- Le signal : fait précis tiré des signaux\n- Le statut : Émergent / Contre-tendance / Friction d'actualité / Micro-niche / Saturation\n- La source : médias et liens\n- La preuve : un chiffre seulement s'il figure dans les signaux (sinon omets la ligne)\n- L'insight : une phrase naturelle (comportement, tension, ce que les marques font encore)\n- L'angle : pour qui + message de marque rédigé, affichable tel quel\n- À vérifier\n\nB) 4 fiches « POUR LES GENS (Artefact 3000) » : ce que l'agence pourrait sortir en son nom pour les gens. Un problème réel que des gens rencontrent à cause d'un événement du moment (grève, blocage, canicule, hausse des prix, panne, réforme, examens...), résolu par une idée CRÉATIVE ET ORIGINALE, simple à réaliser vite. Ce peut être un outil, un objet, un affichage, un détournement, un service, un événement, un contenu : pas forcément numérique. Format :\nN. Titre\n- Public touché\n- Le problème : une phrase appuyée sur les signaux\n- L'idée : une à trois phrases concrètes\n- Le format : outil, affichage, objet, événement, contenu, détournement...\n- Effort estimé : léger (quelques jours) / moyen / lourd, à confirmer\n- Clients possibles : noms pris dans la liste, ou aucun\n- Limites : neutralité, droits, risques, ce qu'il ne faut pas promettre\n- Sources : médias et liens, et À vérifier\n\nRègles : n'invente aucun chiffre, étude, institut ni source ; zéro marronnier déjà rincé sauf contrecoup ; priorité aux frictions et aux problèmes pratiques ; privilégie les sujets confirmés par plusieurs sources et ceux qui concernent au moins un client ; français sobre, sans métaphore physique ni mot inventé.\nPour les idées « Artefact 3000 » : NON PARTISANES (elles aident les gens, ne prennent jamais parti pour ou contre un mouvement, un gouvernement ou une entreprise), jamais sur un drame, un deuil ou une catastrophe, aucune donnée personnelle sensible, aucun effet chiffré promis.\nLes sujets sensibles (deuil, drame, crime, polémique clivante) ne reçoivent AUCUNE idée : liste-les à part sous « Ça monte, ne pas rebondir ». Pour les associations de la liste, un sujet grave n'est possible que si l'idée est respectueuse et utile (note « validation requise »).\n\nDATE : 24/11/2026 00:34\n\nCLIENTS DE L'AGENCE (nom : thèmes) :\n- Thermor : chauffage, eau chaude, radiateur, chauffe-eau, pompe à chaleur, facture d'énergie, facture de chauffage, froid\n- Atlantic : chauffage, pompe à chaleur, eau chaude, chauffe-eau, climatisation, canicule, facture d'énergie, vague de froid\n- Direct Assurance : assurance, assureur, sinistre, sécurité routière, accident de la route, permis de conduire, tempête, grêle\n- Pierre & Vacances : vacances, vacances scolaires, séjour, week-end, station de ski, ski, tourisme, location de vacances\n- En Avant Toutes : violences sexistes, violences conjugales, harcèlement, cyberharcèlement, consentement, féminisme, sexisme, égalité femmes-hommes\n- True Fruits : smoothie, jus de frui
