#monte h3,#chiffres h3,#auto h3{margin:10px 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.mrow{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:10px 14px;margin-bottom:8px;display:grid;gap:2px}
.mrow.no{border-left-color:var(--mut);opacity:.85}
.mrow b{font-size:15px}.tiny{font-size:12px;color:var(--mut)}a{color:inherit}
.sec{grid-column:1/-1;margin:14px 0 0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}

.card.a3{border-top:4px solid var(--base)}.b.fam{background:var(--base)}

station du 5 novembre à Paris : transports, écoles, parcours, le point", "source": "Sortir à Paris", "url": "https://news.google.com/rss/articles/CBMi3AFBVV95cUxPM3dvVGQyS21henhmZWRud0d2Q0gwUEY3RkFpcnMtNW90SDBnX3VKZFdfcEgyak1vRjVPZXJ2ODAwdWNYUklWcV94NjFRTDhzeWV6bi1wLUhwTVNkN0pDdVBCbndZWDV5anUtZC1vRy02Qld0Ml90bFRQMDNQMkJBaHA5cl81N3puR2tIVW4xb0NjOWtEbldlMW90QVRkTmVPd0tNZDBQMVNlNU04T1I0UmE3d2FnNjlZZG1MWnRKd3M3NEZyNEY5SmM2amc3Q2hRXzA5UkRibWJNYVph?oc=5", "age": null, "evenement": "grève"}], "nb_medias": 1, "clients": []}, {"public": "Étudiants et lycéens", "items": [{"titre": "« La violence est un langage : il faut écouter ce qu’elle raconte »", "source": "La Déferlante", "url": "https://revueladeferlante.fr/la-violence-est-un-langage-il-faut-ecouter-ce-quelle-raconte/", "age": 144, "evenement": "mobilisation"}], "nb_medias": 1, "clients": []}, {"public": "Ménages (budget, énergie, courses)", "items": [{"titre": "Anasse Kazib : « Avec la grève, on touche le grand patronat au portefeuille »", "source": "Reporterre", "url": "https://reporterre.net/Anasse-Kazib-Avec-la-greve-on-touche-le-grand-patronat-au-portefeuille", "age": 0, "evenement": "grève"}], "nb_medias": 1, "clients": []}], "clients_liste": ["Thermor", "Atlantic", "Direct Assurance", "Pierre & Vacances", "En Avant Toutes", "True Fruits", "Groupe ADP", "Paris Aéroport", "Fondation BNP Paribas", "TotalEnergies", "Robertet", "eBay", "Azura", "TF1 +", "WWF"], "prompt": "Tu es l'assistant de veille d'une agence de publicité, « Artefact 3000 », dirigée par un directeur de création. Voici les signaux du jour repérés automatiquement (articles récents, pics, chiffres, frictions, problèmes concrets).\nÀ partir de ces seuls éléments, rédige 10 fiches en DEUX FAMILLES :\n\nA) 6 fiches « POUR LES CLIENTS » : un fait, une friction ou une contre-tendance utile à un ou plusieurs clients de l'agence (liste ci-dessous). Format :\nN. Domaine : titre\n- Clients concernés : noms pris dans la liste\n- Le signal : fait précis tiré des signaux\n- Le statut : Émergent / Contre-tendance / Friction d'actualité / Micro-niche / Saturation\n- La source : médias et liens\n- La preuve : un chiffre seulement s'il figure dans les signaux (sinon omets la ligne)\n- L'insight : une phrase naturelle (comportement, tension, ce que les marques font encore)\n- L'angle : pour qui + message de marque rédigé, affichable tel quel\n- À vérifier\n\nB) 4 fiches « POUR LES GENS (Artefact 3000) » : ce que l'agence pourrait sortir en son nom pour les gens. Un problème réel que des gens rencontrent à cause d'un événement du moment (grève, blocage, canicule, hausse des prix, panne, réforme, examens...), résolu par une idée CRÉATIVE ET ORIGINALE, simple à réaliser vite. Ce peut être un outil, un objet, un affichage, un détournement, un service, un événement, un contenu : pas forcément numérique. Format :\nN. Titre\n- Public touché\n- Le problème : une phrase appuyée sur les signaux\n- L'idée : une à trois phrases concrètes\n- Le format : outil, affichage, objet, événement, contenu, détournement...\n- Effort estimé : léger (quelques jours) / moyen / lourd, à confirmer\n- Clients possibles : noms pris dans la liste, ou aucun\n- Limites : neutralité, droits, risques, ce qu'il ne faut pas promettre\n- Sources : médias et liens, et À vérifier\n\nRègles : n'invente aucun chiffre, étude, institut ni source ; zéro marronnier déjà rincé sauf contrecoup ; priorité aux frictions et aux problèmes pratiques ; privilégie les sujets confirmés par plusieurs sources et ceux qui concernent au moins un client ; français sobre, sans métaphore physique ni mot inventé.\nPour les idées « Artefact 3000 » : NON PARTISANES (elles aident les gens, ne prennent jamais parti pour ou contre un mouvement, un gouvernement ou une entreprise), jamais sur un drame, un deuil ou une catastrophe, aucune donnée personnelle sensible, aucun effet chiffré promis.\nLes sujets sensibles (deuil, drame, crime, polémique clivante) ne reçoivent AUCUNE idée : liste-les à part sous « Ça monte, ne pas rebondir ». Pour les associations de la liste, un sujet grave n'est possible que si l'idée est respectueuse et utile (note « validation requise »).\n\nDATE : 04/11/2026 16:19\n\nCLIENTS DE L'AGENCE (nom : thèmes) :\n- Thermor : chauffage, eau chaude, radiateur, chauffe-eau, pompe à chaleur, facture d'énergie, facture de chauffage, froid\n- Atlantic : chauffage, pompe à chaleur, eau chaude, chauffe-eau, climatisation, canicule, facture d'énergie, vague de froid\n- Direct Assurance : assurance, assureur, sinistre, sécurité routière, accident de la route, permis de conduire, tempête, grêle\n- Pierre & Vacances : vacances, vacances scolaires, séjour, week-end, station de ski, ski, tourisme, location de vacances\n- En Avant Toutes : violences sexistes, violences conjugales, harcèlement, cyberharcèlement, consentement, féminisme, sexisme, égalité femmes-hommes\n- True Fruits : smoothie, jus de fruits, fruits, boisson, sucre, fruit\n- Groupe ADP : aéroport, aéroports, Roissy, Orly, avion, aérien, compagnie aérienne, bagages\n- Paris Aéroport : aéroport, aéroports, Roissy, Orly, avion, aérien, compagnie aérienne, bagages\n- Fondation BNP Paribas : mécénat, solidarité, inclusion, précarité, handicap, association, recherche médicale, fondation\n- TotalEnergies : carburant, essence, gazole, électricité, gaz, transition énergétique, voiture électrique, borne de recharge\n- Robertet : parfum, parfumerie, senteur, matières naturelles, arômes, jasmin, olfactif, grasse\n- eBay : seconde main, occasion, reconditionné, vide-grenier, enchères, vente en ligne, vinted, leboncoin\n- Azura : (à préciser : secteur et thèmes d'actualité)\n- TF1 + : série, téléréalité, streaming, TF1, football, émission, audience, Star Academy\n- WWF : biodiversité, climat, océan, océans, forêt, espèces menacées, pollution, réchauffement\n\nCONTEXTE :\nArtefact 3000 est une agence de publicité. Elle ne vend pas d'outil : elle répond à un problème réel des gens par une idée créative et originale.\nTon souhaité : direct, concret, sans slogan creux. Les idées doivent pouvoir se réaliser vite.\nCLIENT: Thermor | chauffage, eau chaude, radiateur, chauffe-eau, pompe à chaleur, facture d'énergie, facture de chauffage, froid, vague de froid, rénovation énergétique, isolation\nCLIENT: Atlantic | chauffage, pompe à chaleur, eau chaude, chauffe-eau, climatisation, canicule, facture d'énergie, vague de froid, rénovation énergétique, isolation\nCLIENT: Direct Assurance | assurance, assureur, sinistre, sécurité routière, accident de la route, permis de conduire, tempête, grêle, franchise, cambriolage, constat\nCLIENT: Pierre & Vacances | vacances, vacances scolaires, séjour, week-end, station de ski, ski, tourisme, location de vacances, résidence de tourisme\nCLIENT: En Avant Toutes | violences sexistes, violences conjugales, harcèlement, cyberharcèlement, consentement, féminisme, sexisme, égalité femmes-hommes, féminicide\nCLIENT: True Fruits | smoothie, jus de fruits, fruits, boisson, sucre, fruit\nCLIENT: Groupe ADP | aéroport, aéroports, Roissy, Orly, avion, aérien, compagnie aérienne, bagages, passagers aériens\nCLIENT: Paris Aéroport | aéroport, aéroports, Roissy, Orly, avion, aérien, compagnie aérienne, bagages, passagers aériens\nCLIENT: Fondation BNP Paribas | mécénat, solidarité, inclusion, précarité, handicap, association, recherche médicale, fondation\nCLIENT: TotalEnergies | carburant, essence, gazole, électricité, gaz, transition énergétique, voiture électrique, borne de recharge, énergie\nCLIENT: Robertet | parfum, parfumerie, senteur, matières naturelles, arômes, jasmin, olfactif, grasse\nCLIENT: eBay | seconde main, occasion, reconditionné, vide-grenier, enchères, vente en ligne, vinted, leboncoin\nCLIENT: Azura | (à préciser : secteur et thèmes d'actualité)\nCLIENT: TF1 + | série, téléréalité, streaming, TF1, football, émission, audience, Star Academy, Koh-Lanta\nCLIENT: WWF | biodiversité, climat, océan, océans, forêt, espèces menacées, p  if((D.frictions||[]).length)A.push("<h3>Frictions du moment (agacement, rejet, saturation)</h3>"+D.frictions.map(f=>`<div class="mrow" data-cl="${esc((f.clients||[]).join("|"))}"><b><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.titre)}</a></b><span class="tiny">${esc(f.source)}${f.age!=null?" · il y a "+f.age+" h":""} · mot repéré : « ${esc(f.mot)} »${cl(f)}</span></div>`).join(""));
