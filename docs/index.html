#monte h3,#chiffres h3,#auto h3{margin:10px 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.mrow{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:10px 14px;margin-bottom:8px;display:grid;gap:2px}
.mrow.no{border-left-color:var(--mut);opacity:.85}

.sec{grid-column:1/-1;margin:14px 0 0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}

.card.a3{border-top:4px solid var(--base)}.b.fam{background:var(--base)}

nts, pics, chiffres, frictions, problèmes concrets).\nÀ partir de ces seuls éléments, rédige 10 fiches en DEUX FAMILLES :\n\nA) 6 fiches « POUR LES CLIENTS » : un fait, une friction ou une contre-tendance utile à un ou plusieurs clients de l'agence (liste ci-dessous). Format :\nN. Domaine : titre\n- Clients concernés : noms pris dans la liste\n- Le signal : fait précis tiré des signaux\n- Le statut : Émergent / Contre-tendance / Friction d'actualité / Micro-niche / Saturation\n- La source : médias et liens\n- La preuve : un chiffre seulement s'il figure dans les signaux (sinon omets la ligne)\n- L'insight : une phrase naturelle (comportement, tension, ce que les marques font encore)\n- L'angle : pour qui + message de marque rédigé, affichable tel quel\n- À vérifier\n\nB) 4 fiches « POUR LES GENS (Artefact 3000) » : ce que l'agence pourrait sortir en son nom pour les gens. Un problème réel que des gens rencontrent à cause d'un événement du moment (grève, blocage, canicule, hausse des prix, panne, réforme, examens...), résolu par une idée CRÉATIVE ET ORIGINALE, simple à réaliser vite. Ce peut être un outil, un objet, un affichage, un détournement, un service, un événement, un contenu : pas forcément numérique. Format :\nN. Titre\n- Public touché\n- Le problème : une phrase appuyée sur les signaux\n- L'idée : une à trois phrases concrètes\n- Le format : outil, affichage, objet, événement, contenu, détournement...\n- Effort estimé : léger (quelques jours) / moyen / lourd, à confirmer\n- Clients possibles : noms pris dans la liste, ou aucun\n- Limites : neutralité, droits, risques, ce qu'il ne faut pas promettre\n- Sources : médias et liens, et À vérifier\n\nRègles : n'invente aucun chiffre, étude, institut ni source ; zéro marronnier déjà rincé sauf contrecoup ; priorité aux frictions et aux problèmes pratiques ; privilégie les sujets confirmés par plusieurs sources et ceux qui concernent au moins un client ; français sobre, sans métaphore physique ni mot inventé.\nPour les idées « Artefact 3000 » : NON PARTISANES (elles aident les gens, ne prennent jamais parti pour ou contre un mouvement, un gouvernement ou une entreprise), jamais sur un drame, un deuil ou une catastrophe, aucune donnée personnelle sensible, aucun effet chiffré promis.\nLes sujets sensibles (deuil, drame, crime, polémique clivante) ne reçoivent AUCUNE idée : liste-les à part sous « Ça monte, ne pas rebondir ». Pour les associations de la liste, un sujet grave n'est possible que si l'idée est respectueuse et utile (note « validation requise »).\n\nDATE : 24/11/2026 20:44\n\nCLIENTS DE L'AGENCE (nom : thèmes) :\n- Thermor : chauffage, eau chaude, radiateur, chauffe-eau, pompe à chaleur, facture d'énergie, facture de chauffage, froid\n- Atlantic : chauffage, pompe à chaleur, eau chaude, chauffe-eau, climatisation, canicule, facture d'énergie, vague de froid\n- Direct Assurance : assurance, assureur, sinistre, sécurité routière, accident de la route, permis de conduire, tempête, grêle\n- Pierre & Vacances : vacances, vacances scolaires, séjour, week-end, station de ski, ski, tourisme, location de vacances\n- En Avant Toutes : violences sexistes, violences conjugales, harcèlement, cyberharcèlement, consentement, féminisme, sexisme, égalité femmes-hommes\n- True Fruits : smoothie, jus de fruits, fruits, boisson, sucre, fruit\n- Groupe ADP : aéroport, aéroports, Roissy, Orly, avion, aérien, compagnie aérienne, bagages\n- Paris Aéroport : aéroport, aéroports, Roissy, Orly, avion, aérien, compagnie aérienne, bagages\n- Fondation BNP Paribas : mécénat, solidarité, inclusion, précarité, handicap, association, recherche médicale, fondation\n- TotalEnergies : carburant, essence, gazole, électricité, gaz, transition énergétique, voiture électrique, borne de recharge\n- Robertet : parfum, parfumerie, senteur, matières naturelles, arômes, jasmin, olfactif, grasse\n- eBay : seconde main, occasion, reconditionné, vide-grenier, enchères, vente en ligne, vinted, leboncoin\n- Azura  $("#raw").innerHTML="<h2>Signaux bruts</h2><table><tr><th>Source</th><th>Sujet</th><th>Mesure</th></tr>"+D.signals.map(s=>`<tr><td>${esc(s.source)}</td><td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></td><td>${esc(s.metric)}</td></tr>`).join("")+"</table>";
}
function monte(){
 if(!(D.ca_monte||[]).length)return;
 $("#monte").innerHTML="<h3>Ça monte aujourd'hui</h3>"+D.ca_monte.map(m=>`<div class="mrow ${m.rebondable?"":"no"}"><b>${esc(m.sujet)} ${m.rebondable?"":'<span class="tiny">· ne pas rebondir</span>'}</b>
 <span>${esc(m.pourquoi)}</span>${m.mesure?`<span class="tiny">${esc(m.mesure)}</span>`:""}
 ${m.idee?`<span><b>Idée :</b> ${esc(m.idee)}</span>`:""}${m.precaution?`<span class="tiny">⚠ ${esc(m.precaution)}</span>`:""}
 <span class="tiny">${(m.liens||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(" · ")}</span></div>`).join("");
}
function chiffres(){
 if(!(D.chiffres||[]).length)return;
 $("#chiffres").innerHTML="<h3>Chiffres &amp; études du jour</h3><div style='display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px'>"+D.chiffres.map(c=>`<div class="mrow"><b style="font-size:22px;color:var(--acc)">${esc(c.chiffre)}</b><span>${esc(c.phrase)}</span><span class="tiny">${esc(c.source)}${(c.liens||[]).length?' · <a href="'+esc(c.liens[0].url)+'" target="_blank" rel="noopener">source</a>':""}</span></div>`).join("")+"</div>";
}
function arch(){
 const inA=location.pathname.includes("/archive/"),pre=inA?"":"archive/";
 const L=(D.archive||[]);if(L.length<2&&!inA)return;
 $("#arch").innerHTML='<span class="tiny">Éditions :</span> <a class="chip" href="'+(inA?"../index.html":"index.html")+'">Dernière</a> '+L.slice(0,14).map(d=>`<a class="chip" href="${pre}${d}.html">${d.slice(8)}/${d.slice(5,7)}</a>`).join(" ");
}
function auto(){
 if(D.mode!=="auto")return;
 const A=[],cl=x=>(x.clients&&x.clients.length)?` · clients : ${esc(x.clients.join(", "))}`:"",age=i=>i.age!=null?`, il y a ${i.age} h`:"";
 A.push('<div class="mrow"><b>Édition automatique, sans IA</b><span class="tiny">Chaque ligne vient d\'un article collecté et garde son lien. Pour obtenir les fiches rédigées (6 pour les clients, 4 idées pour les gens), copie le prompt ci-dessous et colle-le dans Claude, Gemini ou ChatGPT.</span><span><button class="chip" id="cp">Copier le prompt pour rédiger les fiches</button></span></div>');
 if((D.problemes||[]).length)A.push('<h3>Problèmes concrets du moment <span class="tiny">(matière à idées « Artefact 3000 pour les gens »)</span></h3>'+D.problemes.map(p=>`<div class="mrow" data-cl="${esc((p.clients||[]).join("|"))}"><b>${esc(p.public)}</b><span class="tiny">${p.nb_medias} média(s)${cl(p)}</span>${p.items.map(i=>`<span><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.titre)}</a> <span class="tiny">(${esc(i.source)}${age(i)})</span></span>`).join("")}</div>`).join(""));
 if((D.sujets||[]).length)A.push("<h3>Sujets repérés par plusieurs sources</h3>"+D.sujets.map(s=>`<div class="mrow ${s.sensible?"no":""}" data-cl="${esc((s.clients||[]).join("|"))}"><b>${esc(s.titre)} ${s.sensible?'<span class="tiny">· sensible, ne pas rebondir</span>':""}</b><span class="tiny">${s.medias.length} médias : ${esc(s.medias.slice(0,6).join(", "))} · mots-clés : ${esc((s.tags||[]).join(", "))}${cl(s)}</span><span class="tiny">${s.liens.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(" · ")}</span></div>`).join(""));
 if((D.frictions||[]).length)A.push("<h3>Frictions du moment (agacement, rejet, saturation)</h3>"+D.frictions.map(f=>`<div class="mrow" data-cl="${esc((f.clients||[]).join("|"))}"><b><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.titre)}</a></b><span class="tiny">${esc(f.source)}${f.age!=null?" · il y a "+f.age+" h":""} · mot repéré : « ${esc(f.mot)} »${cl(f)}</span></div>`).join(""));
 if((D.lectures||[]).length)A.push("<h3>À lire cette semaine (newsletters, culture)</h3>"+D.lectures.map(l=>`<div class="mrow"><b><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.titre)}</a></b><span class="tiny">${esc(l.source)}${l.age!=null?" · il y a "+Math.round(l.age/24)+" j":""}</span>${l.note?`<span class="tiny">${esc(l.note)}</span>`:""}</div>`).join(""));
 $("#auto").innerHTML=A.join("");
 const b=$("#cp");if(b)b.onclick=()=>{try{navigator.clipboard.writeText(D.prompt||"");b.textContent="Copié ✓ - colle-le dans ton outil de chat"}catch(e){b.textContent="Copie impossible : sélectionne le texte à la main"}};
}
function ko(){if((D.feeds_ko||[]).length)$("#ko").innerHTML='<p class="tiny">Flux sans réponse ce jour : '+esc(D.feeds_ko.join(", "))+"</p>"}
bar();monte();chiffres();auto();draw();raw();ko();arch();
</script></body></html>
