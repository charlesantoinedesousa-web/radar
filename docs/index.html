blic": "Voyageurs et usagers des transports", "items": [{"titre": "Les Français et le futur : 5 chiffres pour briser les clichés", "source": "Usbek & Rica", "url": "https://usbeketrica.com/fr/article/jeunes-moderes-riches-pessimistes-5-cliches-sur-notre-rapport-au-futur-dementis", "age": 93, "evenement": "rupture"}], "nb_medias": 1, "clients": []}], "clients_liste": ["Thermor", "Atlantic", "Direct Assurance", "Pierre & Vacances", "En Avant Toutes", "True Fruits", "Groupe ADP", "Paris Aéroport", "Fondation BNP Paribas", "TotalEnergies", "Robertet", "eBay", "Azura", "TF1 +", "WWF"], "prompt": "Tu es l'assistant de veille d'une agence de publicité, « Artefact 3000 », dirigée par un directeur de création. Voici les signaux du jour repérés automatiquement (articles récents, pics, chiffres, frictions, problèmes concrets).\nÀ partir de ces seuls éléments, rédige 10 fiches en DEUX FAMILLES :\n\nA) 6 fiches « POUR LES CLIENTS » : un fait, une friction ou une contre-tendance utile à un ou plusieurs clients de l'agence (liste ci-dessous). Format :\nN. Domaine : titre\n- Clients concernés : noms pris dans la liste\n- Le signal : fait précis tiré des signaux\n- Le statut : Émergent / Contre-tendance / Friction d'actualité / Micro-niche / Saturation\n- La source : médias et liens\n- La preuve : un chiffre seulement s'il figure dans les signaux (sinon omets la ligne)\n- L'insight : une phrase naturelle (comportement, tension, ce que les marques font encore)\n- L'angle : pour qui + message de marque rédigé, affichable tel quel\n- À vérifier\n\nB) 4 fiches « POUR LES GENS (Artefact 3000) » : ce que l'agence pourrait sortir en son nom pour les gens. Un problème réel que des gens rencontrent à cause d'un événement du moment (grève, blocage, canicule, hausse des prix, panne, réforme, examens...), résolu par une idée CRÉATIVE ET ORIGINALE, simple à réaliser vite. Ce peut être un outil, un objet, un affichage, un détournement, un service, un événement, un contenu : pas forcément numérique. Format :\nN. Titre\n- Public touché\n- Le problème : une phrase appuyée sur les signaux\n- L'idée : une à trois phrases concrètes\n- Le format : outil, affichage, objet, événement, contenu, détournement...\n- Effort estimé : léger (quelques jours) / moyen / lourd, à confirmer\n- Clients possibles : noms pris dans la liste, ou aucun\n- Limites : neutralité, droits, risques, ce qu'il ne faut pas promettre\n- Sources : médias et liens, et À vérifier\n\nRègles : n'invente aucun chiffre, étude, institut ni source ; zéro marronnier déjà rincé sauf contrecoup ; priorité aux frictions et aux problèmes pratiques ; privilégie les sujets confirmés par plusieurs sources et ceux qui concernent au moins un client ; français sobre, sans métaphore physique ni mot inventé.\nPour les idées « Artefact 3000 » : NON PARTISANES (elles aident les gens, ne prennent jamais parti pour ou contre un mouvement, un gouvernement ou une entreprise), jamais sur un drame, un deuil ou une catastrophe, aucune donnée personnelle sensible, aucun effet chiffré promis.\nLes sujets sensibles (deuil, drame, crime, polémique clivante) ne reçoivent AUCUNE idée : liste-les à part sous « Ça monte, ne pas rebondir ». Pour les associations de la liste, un sujet grave n'est possible que si l'idée est respectueuse et utile (note « validation requise »).\n\nDATE : 10/11/2026 14:00\n\nCLIENTS DE L'AGENCE (nom : thèmes) :\n- Thermor : chauffage, eau chaude, radiateur, chauffe-eau, pompe à chaleur, facture d'énergie, facture de chauffage, froid\n- Atlantic : chauffage, pompe à chaleur, eau chaude, chauffe-eau, climatisation, canicule, facture d'énergie, vague de froid\n- Direct Assurance : assurance, assureur, sinistre, sécurité routière, accident de la route, permis de conduire, tempête, grêle\n- Pierre & Vacances : vacances, vacances scolaires, séjour, week-end, station de ski, ski, tourisme, location de vacances\n- En Avant Toutes : violences sexistes, violences conjugales, harcèlement, cyberharcèlement, consentement, féminisme, sexisme, égalité femmes-hommes\n- True Fruits : smoothie, jus de fruits, fruits, boisson, sucre, fruit\n- Groupe ADP : aéroport, aéroports, Roissy, Orly, avion, aérien, compagnie aérienne, bagages\n- Paris Aéroport : aéroport, aéroports, Roissy, Orly, avion, aérien, compagnie aérienne, bagages\n- Fondation BNP Paribas : mécénat, solidarité, inclusion, précarité, handicap, association, recherche médicale, fondation\n- TotalEnergies : carburant, essence, gazole, électricité, gaz, transition énergétique, voiture électrique, borne de recharge\n- Robertet : parfum, parfumerie, senteur, matières naturelles, arômes, jasmin, olfactif, grasse\n- eBay : seconde main, occasion, reconditionné, vide-grenier, enchères, vente en ligne, vinted, leboncoin\n- Azura : (à préciser : secteur et thèmes d'actualité)\n- TF1 + : série, téléréalité, streaming, TF1, football, émission, audience, Star Academy\n- WWF : biodiversité, climat, océan, océans, forêt, espèces menacées, pollution, réchauffement\n\nCONTEXTE :\nArtefact 3000 est une agence de publicité. Elle ne vend pas d'outil : elle répond à un problème réel des gens par une idée créative et originale.\nTon souhaité : direct, concret, sans slogan creux. Les idées doivent pouvoir se réaliser vite.\nCLIENT: Thermor | chauffage, eau chaude, radiateur, chauffe-eau, pompe à chaleur, facture d'énergie, facture de chauffage, froid, vague de froid, rénovation énergétique, isolation\nCLIENT: Atlantic | chauffage, pompe à chaleur, eau chaude, chauffe-eau, climatisation, canicule, facture d'énergie, vague de froid, rénovation énergétique, isolation\nCLIENT: Direct Assurance | assurance, assureur, sinistre, sécurité routière, accident de la route, permis de conduire, tempête, grêle, franchise, cambriolage, constat\nCLIENT: Pierre & Vacances | vacances, vacances scolaires, séjour, week-end, station de ski, ski, tourisme, location de vacances, résidence de tourisme\nCLIENT: En Avant Toutes | violences sexistes, violences conjugales const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let urg="all",cat="all",q="",fam="all",cli="all";

function allClients(){const s=new Set();[...D.fiches,...(D.sujets||[]),...(D.frictions||[]),...(D.problemes||[])].forEach(x=>(x.clients||[]).forEach(c=>s.add(c)));return [...s]}
function bar(){
 const hasF=D.fiches.length,cls=allClients();
 if(!hasF&&!cls.length){$("#bar").innerHTML="";return}
 let h="";
 if(hasF){
  const FL={all:"Tout",client:"Pour les clients",artefact3000:"Pour les gens · Artefact 3000"};
  h+=Object.keys(FL).map(k=>`<button class="chip ${fam===k?"on":""}" data-f="${k}">${FL[k]}</button>`).join("");
  h+=["all",...Object.keys(U)].map(k=>`<button class="chip ${urg===k?"on":""}" data-u="${k}">${k==="all"?"Toutes urgences":U[k]}</button>`).join("");
 }
 if(cls.length)h+=`<select id="cli"><option value="all">Tous les clients</option>${cls.map(c=>`<option ${c===cli?"selected":""}>${esc(c)}</option>`).join("")}</select>`;
 if(hasF){const cats=[...new Set(D.fiches.map(f=>f.categorie).filter(Boolean))];h+=`<select id="cat"><option value="all">Toutes catégories</option>${cats.map(c=>`<option ${c===cat?"selected":""}>${esc(c)}</option>`).join("")}</select><input id="q" placeholder="Rechercher…" value="${esc(q)}">`}
 $("#bar").innerHTML=h;

 if($("#cli"))$("#cli").onchange=e=>{cli=e.target.value;draw()};

 if($("#q"))$("#q").oninput=e=>{q=e.target.value.toLowerCase();draw()};
}
function card(f){
 const liens=(f.liens||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(" · ");
 const pied=`<div class="tiny">Sources : ${esc((f.sources||[]).join(", "))}${liens?"<br>"+liens:""}</div>${f.a_verifier?`<div class="tiny">À vérifier : ${esc(f.a_verifier)}</div>`:""}`;
 if(f.famille==="artefact3000")return `<article class="card a3"><div class="top"><span class="b fam">Artefact 3000</span><span>${esc(f.categorie||"")}</span></div>
 <h2>${esc(f.titre)}</h2>${chips(f.clients)}
 <div><div class="lbl">Public touché</div>${esc(f.public)}</div>
 <div><div class="lbl">Le problème</div>${esc(f.probleme||f.signal)}</div>
 ${f.preuve?`<div class="proof"><div class="lbl">La preuve</div>${esc(f.preuve)}</div>`:""}
 <div class="idea"><div class="lbl">L'idée</div>${f.accroche?`<div style="font-size:17px;font-weight:700;color:var(--base);margin-bottom:4px">« ${esc(f.accroche)} »</div>`:""}<b>${esc(f.idee)}</b>${f.originalite?`<div class="tiny" style="margin-top:6px">Ce qui la rend originale : ${esc(f.originalite)}</div>`:""}${(f.format||f.effort)?`<div class="tiny">${f.format?"Format : "+esc(f.format):""}${f.effort?" · effort estimé (à confirmer) : "+esc(f.effort):""}</div>`:""}<button class="cp" data-t="${esc(f.idee)}">Copier</button></div>
 ${f.limites?`<div class="tiny">⚠ Limites : ${esc(f.limites)}</div>`:""}${pied}</article>`;
 return `<article class="card"><div class="top"><span class="b ${esc(f.urgence)}">${U[f.urgence]||esc(f.urgence)}</span><span>${esc(f.categorie)}</span></div>
 <h2>${esc(f.titre)}</h2>${chips(f.clients)}
 <div><div class="lbl">Le signal</div>${esc(f.signal)}</div>
 <div><div class="lbl">Statut</div>${esc(f.statut)}</div>
 ${f.insight?`<div class="proof"><div class="lbl">L'insight</div><b>${esc(f.insight)}</b></div>`:""}
 ${f.preuve?`<div class="proof"><div class="lbl">La preuve</div>${esc(f.preuve)}</div>`:""}
 ${f.rebondable===false?`<div class="warn"><b>Ne pas rebondir.</b> ${esc(f.risque)}</div>`:(f.risque?`<div class="tiny">⚠ ${esc(f.risque)}</div>`:"")}
 ${(f.angles||[]).map((a,i)=>`<div class="angle"><b>Pour : ${esc(a.pour_qui)}</b>${esc(a.message)}<br><button class="cp" data-t="${esc(a.message)}">Copier</button></div>`).join("")}
 ${pied}</article>`;
}
function ok(f){return (fam==="all"||(f.famille||"client")===fam)&&(urg==="all"||f.urgence===urg)&&(cat==="all"||f.categorie===cat)&&(cli==="all"||(f.clients||[]).includes(cli))&&(!q||JSON.stringify(f).toLowerCase().includes(q))}
function applyCli(){document.querySelectorAll("[data-cl]").forEach(e=>{const l=e.dataset.cl?e.dataset.cl.split("|"):[];e.style.display=(cli==="all"||l.includes(cli))?"":"none"})}
function draw(){
 const L=D.fiches.filter(ok),C=L.filter(f=>(f.famille||"client")!=="artefact3000"),G=L.filter(f=>f.famille==="artefact3000");
 let h="";
 if(C.length)h+='<h3 class="sec">Pour les clients<small>faits, frictions et angles de marque</small></h3>'+C.map(card).join("");
 if(G.length)h+='<h3 class="sec">Pour les gens · Artefact 3000<small>problèmes réels, idées créatives à sortir en notre nom</small></h3>'+G.map(card).join("");
 $("#cards").innerHTML=h||(D.fiches.length?'<p class="sub">Aucune fiche.</p>':"");
 document.querySelectorAll(".cp").forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.t);b.textContent="Copié ✓"});
 applyCli();
}

function auto(){
 if(D.mode!=="auto")return;
 const A=[],cl=x=>(x.clients&&x.clients.length)?` · clients : ${esc(x.clients.join(", "))}`:"",age=i=>i.age!=null?`, il y a ${i.age} h`:"";
 A.push('<div class="mrow"><b>Édition automatique, sans IA</b><span class="tiny">Chaque ligne vient d\'un article collecté et garde son lien. Pour obtenir les fiches rédigées (6 pour les clients, 4 idées pour les gens), copie le prompt ci-dessous et colle-le dans Claude, Gemini ou ChatGPT.</span><span><button class="chip" id="cp">Copier le prompt pour rédiger les fiches</button></span></div>');
 if((D.problemes||[]).length)A.push('<h3>Problèmes concrets du moment <span class="tiny">(matière à idées « Artefact 3000 pour les gens »)</span></h3>'+D.problemes.map(p=>`<div class="mrow" data-cl="${esc((p.clients||[]).join("|"))}"><b>${esc(p.public)}</b><span class="tiny">${p.nb_medias} média(s)${cl(p)}</span>${p.items.map(i=>`<span><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.titre)}</a> <span class="tiny">(${esc(i.source)}${age(i)})</span></span>`).join("")}</div>`).join(""));
 if((D.sujets||[]).length)A.push("<h3>Sujets repérés par plusieurs sources</h3>"+D.sujets.map(s=>`<div class="mrow ${s.sensible?"no":""}" data-cl="${esc((s.clients||[]).join("|"))}"><b>${esc(s.titre)} ${s.sensible?'<span class="tiny">· sensible, ne pas rebondir</span>':""}</b><span class="tiny">${s.medias.length} médias : ${esc(s.medias.slice(0,6).join(", "))} · mots-clés : ${esc((s.tags||[]).join(", "))}${cl(s)}</span><span class="tiny">${s.liens.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(" · ")}</span></div>`).join(""));
 if((D.frictions||[]).length)A.push("<h3>Frictions du moment (agacement, rejet, saturation)</h3>"+D.frictions.map(f=>`<div class="mrow" data-cl="${esc((f.clients||[]).join("|"))}"><b><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.titre)}</a></b><span class="tiny">${esc(f.source)}${f.age!=null?" · il y a "+f.age+" h":""} · mot repéré : « ${esc(f.mot)} »${cl(f)}</span></div>`).join(""));
 if((D.lectures||[]).length)A.push("<h3>À lire cette semaine (newsletters, culture)</h3>"+D.lectures.map(l=>`<div class="mrow"><b><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.titre)}</a></b><span class="tiny">${esc(l.source)}${l.age!=null?" · il y a "+Math.round(l.age/24)+" j":""}</span>${l.note?`<span class="tiny">${esc(l.note)}</span>`:""}</div>`).join(""));
