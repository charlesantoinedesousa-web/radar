function bar(){
 const cats=[...new Set(D.fiches.map(f=>f.categorie))];
 $("#bar").innerHTML=["all",...Object.keys(U)].map(k=>`<button class="chip ${urg===k?"on":""}" data-u="${k}">${k==="all"?"Tout":U[k]}</button>`).join("")+
 `<select id="cat"><option value="all">Toutes catégories</option>${cats.map(c=>`<option ${c===cat?"selected":""}>${esc(c)}</option>`).join("")}</select><input id="q" placeholder="Rechercher…" value="${esc(q)}">`;
 document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{urg=b.dataset.u;bar();draw()});
 $("#cat").onchange=e=>{cat=e.target.value;draw()};$("#q").oninput=e=>{q=e.target.value.toLowerCase();draw()};
}
function card(f){
 const liens=(f.liens||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(" · ");
 return `<article class="card"><div class="top"><span class="b ${esc(f.urgence)}">${U[f.urgence]||esc(f.urgence)}</span><span>${esc(f.categorie)}</span></div>
 <h2>${esc(f.titre)}</h2>
 <div><div class="lbl">Le signal</div>${esc(f.signal)}</div>
 <div><div class="lbl">Statut</div>${esc(f.statut)}</div>
 ${f.insight?`<div class="proof"><div class="lbl">L'insight</div><b>${esc(f.insight)}</b></div>`:""}
 ${f.preuve?`<div class="proof"><div class="lbl">La preuve</div>${esc(f.preuve)}</div>`:""}
 ${f.rebondable===false?`<div class="warn"><b>Ne pas rebondir.</b> ${esc(f.risque)}</div>`:(f.risque?`<div class="tiny">⚠ ${esc(f.risque)}</div>`:"")}
 ${(f.angles||[]).map((a,i)=>`<div class="angle"><b>Pour : ${esc(a.pour_qui)}</b>${esc(a.message)}<br><button class="cp" data-t="${esc(a.message)}">Copier</button></div>`).join("")}
 <div class="tiny">Sources : ${esc((f.sources||[]).join(", "))}${liens?"<br>"+liens:""}</div>
 ${f.a_verifier?`<div class="tiny">À vérifier : ${esc(f.a_verifier)}</div>`:""}</article>`;
}
function draw(){
 const L=D.fiches.filter(f=>(urg==="all"||f.urgence===urg)&&(cat==="all"||f.categorie===cat)&&(!q||JSON.stringify(f).toLowerCase().includes(q)));
 $("#cards").innerHTML=L.map(card).join("")||(D.fiches.length?'<p class="sub">Aucune fiche.</p>':"");
 document.querySelectorAll(".cp").forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.t);b.textContent="Copié ✓"});
}
function raw(){
 if(D.fiches.length||!D.signals.length)return;
 $("#raw").innerHTML="<h2>Signaux bruts</h2><table><tr><th>Source</th><th>Sujet</th><th>Mesure</th></tr>"+D.signals.map(s=>`<tr><td>${esc(s.source)}</td><td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></td><td>${esc(s.metric)}</td></tr>`).join("")+"</table>";
}
function monte(){
 if(!(D.ca_monte||[]).length)return;
 $("#monte").innerHTML="<h3>Ça monte aujourd'hui</h3>"+D.ca_monte.map(m=>`<div class="mrow ${m.rebondable?"":"no"}"><b>${esc(m.sujet)} ${m.rebondable?"":'<span class="tiny">· ne pas rebondir</span>'}</b>
 <span>${esc(m.pourquoi)}</span>${m.mesure?`<span class="tiny">${esc(m.mesure)}</span>`:""}
 ${m.idee?`<span><b>Idée :</b> ${esc(m.idee)}</span>`:""}${m.precaution?`<span class="tiny">⚠ ${esc(m.precaution)}</span>`:""}
 <span class="tiny">${(m.liens||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(" · ")}</span></div>`).join("");
}
function chiffres(){
 if(!(D.chiffres||[]).length)return;
 $("#chiffres").innerHTML="<h3>Chiffres &amp; études du jour</h3><div style='display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px'>"+D.chiffres.map(c=>`<div class="mrow"><b style="font-size:22px;color:var(--acc)">${esc(c.chiffre)}</b><span>${esc(c.phrase)}</span><span class="tiny">${esc(c.source)}${(c.liens||[]).length?' · <a href="'+esc(c.liens[0].url)+'" target="_blank" rel="noopener">source</a>':""}</span></div>`).join("")+"</div>";
}
function arch(){
 const inA=location.pathname.includes("/archive/"),pre=inA?"":"archive/";
 const L=(D.archive||[]);if(L.length<2&&!inA)return;
 $("#arch").innerHTML='<span class="tiny">Éditions :</span> <a class="chip" href="'+(inA?"../index.html":"index.html")+'">Dernière</a> '+L.slice(0,14).map(d=>`<a class="chip" href="${pre}${d}.html">${d.slice(8)}/${d.slice(5,7)}</a>`).join(" ");
}
function ko(){if((D.feeds_ko||[]).length)$("#ko").innerHTML='<p class="tiny">Flux sans réponse ce jour : '+esc(D.feeds_ko.join(", "))+"</p>"}
bar();monte();chiffres();draw();raw();ko();arch();
</script></body></html>
