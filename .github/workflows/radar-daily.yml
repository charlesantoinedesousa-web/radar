name: radar-daily
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 radar.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RADAR_WEBHOOK: ${{ secrets.RADAR_WEBHOOK }}
      - name: Publier le brief du jour
        run: |
          git config user.name radar && git config user.email radar@users.noreply.github.com
          git add docs && git commit -m "Brief du $(date +%F)" && git push || true
