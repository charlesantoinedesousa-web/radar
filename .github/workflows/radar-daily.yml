name: radar-daily
on:
  schedule:
    - cron: "30 8 * * *"   # édition du matin, 8h30 UTC (9h30/10h30 à Paris)
    - cron: "30 10 * * *"  # 2e essai : seulement si l'édition du matin n'a pas pu utiliser l'IA
    - cron: "0 13 * * *"   # mise à jour de l'après-midi, 13h UTC (14h/15h à Paris)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    env:   # clés facultatives : sans clé (ou si l'IA est saturée), RADAR publie l'édition automatique
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RADAR_ORDER: mistral,gemini,claude   # Mistral d'abord ; Gemini en secours ; Claude seulement si une clé existe
      RADAR_WEBHOOK: ${{ secrets.RADAR_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 radar.py ${{ github.event.schedule == '0 13 * * *' && '--monte' || (github.event.schedule == '30 10 * * *' && '--si-absent' || '') }}
      - name: Publier
        run: |
          git config user.name radar && git config user.email radar@users.noreply.github.com
          git add docs && git commit -m "RADAR $(date +%F-%H%M)" || exit 0
          git pull --rebase || true
          git push || true
