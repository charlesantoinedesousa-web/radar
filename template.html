<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RADAR</title>
<style>
:root{--bg:#f6f4ef;--fg:#18181b;--mut:#6b6b73;--card:#fff;--line:#e4e1d8;--acc:#e5322d;--hot:#e5322d;--up:#d98a00;--base:#3a6ea5}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--fg:#f1f0ec;--mut:#9a9aa3;--card:#1c1c20;--line:#2c2c33}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{padding:28px 16px 12px;max-width:1100px;margin:auto}
h1{margin:0;font-size:28px;letter-spacing:.14em}h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:13px}
.banner{max-width:1100px;margin:8px auto;padding:10px 14px;border:1px dashed var(--up);color:var(--up);border-radius:8px;font-size:13px}
.bar{max-width:1100px;margin:auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip,select,input{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:6px 12px;cursor:pointer}
.chip.on{background:var(--fg);color:var(--bg)}input{cursor:text;min-width:180px}
main{max-width:1100px;margin:auto;padding:8px 16px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut)}
.b{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11px;padding:2px 8px;border-radius:99px;color:#fff}
.chaud{background:var(--hot)}.montant{background:var(--up)}.fond{background:var(--base)}
h2{font-size:18px;line-height:1.25;margin:0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:2px}
.proof{border-left:3px solid var(--acc);padding-left:10px}
.angle{background:var(--bg);border-radius:8px;padding:10px;font-size:14px}
.angle b{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:4px}
button.cp{margin-top:6px;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:3px 8px;cursor:pointer}
.warn{background:#e5322d1a;color:var(--hot);border-radius:8px;padding:8px 10px;font-size:13px}
.tiny{font-size:12px;color:var(--mut)}a{color:inherit}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.raw{max-width:1100px;margin:auto;padding:8px 16px 60px;overflow-x:auto}
</style></head><body>
<header><h1>RA<span>DAR</span></h1><div class="sub" id="meta"></div></header>
<div id="banner"></div>
<div class="bar" id="bar"></div>
<main id="cards"></main>
<div class="raw" id="raw"></div>
<script>
const D=/*DATA*/null;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const U={chaud:"Chaud 24-72h",montant:"Ça monte",fond:"Tendance de fond"};
let urg="all",cat="all",q="";
$("#meta").textContent="Mis à jour le "+D.generated+" · "+D.fiches.length+" fiches · "+D.signals.length+" signaux";
if(D.mode==="demo")$("#banner").innerHTML='<div class="banner">Mode démo : fiches d\'exemple, chiffres et sources non vérifiés. Lance <code>python radar.py</code> pour des données réelles.</div>';
function bar(){
 const cats=[...new Set(D.fiches.map(f=>f.categorie))];
 $("#bar").innerHTML=["all",...Object.keys(U)].map(k=>`<button class="chip ${urg===k?"on":""}" data-u="${k}">${k==="all"?"Tout":U[k]}</button>`).join("")+
 `<select id="cat"><option value="all">Toutes catégories</option>${cats.map(c=>`<option ${c===cat?"selected":""}>${esc(c)}</option>`).join("")}</select><input id="q" placeholder="Rechercher…" value="${esc(q)}">`;
 document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{urg=b.dataset.u;bar();draw()});
 $("#cat").onchange=e=>{cat=e.target.value;draw()};$("#q").oninput=e=>{q=e.target.value.toLowerCase();draw()};
}
function card(f){
 const liens=(f.liens||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(" · ");
 return `<article class="card"><div class="top"><span class="b ${esc(f.urgence)}">${U[f.urgence]||esc(f.urgence)}</span><span>${esc(f.categorie)}</span></div>
 <h2>${esc(f.titre)}</h2>
 <div><div class="lbl">Le signal</div>${esc(f.signal)}</div>
 <div><div class="lbl">Statut</div>${esc(f.statut)}</div>
 ${f.preuve?`<div class="proof"><div class="lbl">La preuve</div>${esc(f.preuve)}</div>`:""}
 ${f.rebondable===false?`<div class="warn"><b>Ne pas rebondir.</b> ${esc(f.risque)}</div>`:(f.risque?`<div class="tiny">⚠ ${esc(f.risque)}</div>`:"")}
 ${(f.angles||[]).map((a,i)=>`<div class="angle"><b>Pour : ${esc(a.pour_qui)}</b>${esc(a.message)}<br><button class="cp" data-t="${esc(a.message)}">Copier</button></div>`).join("")}
 <div class="tiny">Sources : ${esc((f.sources||[]).join(", "))}${liens?"<br>"+liens:""}</div>
 ${f.a_verifier?`<div class="tiny">À vérifier : ${esc(f.a_verifier)}</div>`:""}</article>`;
}
function draw(){
 const L=D.fiches.filter(f=>(urg==="all"||f.urgence===urg)&&(cat==="all"||f.categorie===cat)&&(!q||JSON.stringify(f).toLowerCase().includes(q)));
 $("#cards").innerHTML=L.map(card).join("")||(D.fiches.length?'<p class="sub">Aucune fiche.</p>':"");
 document.querySelectorAll(".cp").forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.t);b.textContent="Copié ✓"});
}
function raw(){
 if(D.fiches.length||!D.signals.length)return;
 $("#raw").innerHTML="<h2>Signaux bruts</h2><table><tr><th>Source</th><th>Sujet</th><th>Mesure</th></tr>"+D.signals.map(s=>`<tr><td>${esc(s.source)}</td><td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></td><td>${esc(s.metric)}</td></tr>`).join("")+"</table>";
}
bar();draw();raw();
</script></body></html>
